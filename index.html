<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 공룡 달리기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--ink:#3b3b3b;--panel:rgba(255,255,255,.85);--acc:#ff6b4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#2b2b2b}}
:root[data-theme="dark"]{--ink:#2b2b2b}
html,body{height:100%;margin:0;overflow:hidden;background:#eaf2f5;font-family:Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;text-align:right;font-size:1.5rem;line-height:1.2}
.hud small{display:block;font-size:1rem;opacity:.65}
#msg{position:fixed;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
#msg h1{margin:0;font-size:clamp(2rem,9vw,3.6rem);font-weight:400}
#msg p{margin:6px 0 0;font-size:1.1rem;opacity:.7}
.pads{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:none;justify-content:space-between;padding:0 16px}
.pads button{width:30vw;max-width:150px;height:64px;border:3px solid var(--ink);border-radius:16px;background:var(--panel);font:inherit;font-size:1.3rem;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.pads button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
@media (pointer:coarse){.pads{display:flex}}
#gear,#rankBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;border:3px solid var(--ink);border-radius:12px;background:var(--panel);font:inherit;font-size:1.05rem;padding:6px 14px;color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
#menu,#rankPanel{position:fixed;inset:0;background:rgba(30,30,50,.45);display:grid;place-items:center;padding:16px;overflow:auto}
.mp{background:#fff;color:#3b3b3b;border:3px solid #3b3b3b;border-radius:20px;padding:18px 20px;width:min(440px,100%);box-shadow:6px 6px 0 #3b3b3b;max-height:100%;overflow:auto;touch-action:pan-y}
.mp h2{margin:0 0 6px;font-weight:400;font-size:1.6rem}
.mp h3{margin:14px 0 6px;font-weight:400;font-size:1.05rem;color:#777}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.o{border:3px solid #3b3b3b;border-radius:12px;background:#fff;color:#3b3b3b;font:inherit;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.o[aria-pressed="true"]{background:#ffd84a}
.o:focus-visible,#gear:focus-visible,#rankBtn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.sw{width:16px;height:16px;border-radius:4px;border:2px solid #3b3b3b}
.go{margin-top:16px;width:100%;justify-content:center;background:var(--acc);color:#fff;border-color:#3b3b3b}
#rankBtn{top:calc(env(safe-area-inset-top,0px) + 58px)}
.rl{margin:0;padding:0;list-style:none}
.rl li{display:flex;justify-content:space-between;gap:10px;padding:7px 6px;border-bottom:2px dashed #ddd}
.rl li.me{background:#fff3b0}
.rn{color:#777;font-size:.95rem;margin:10px 0 0}
.mp input{width:100%;border:3px solid #3b3b3b;border-radius:12px;padding:6px 12px;font:inherit;color:#3b3b3b;background:#fff}
.mp input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="hud"><small>최고 <span id="hi">00000</span></small><span id="sc">00000</span></div>
<div id="msg"><h1>3D 공룡 달리기</h1><p>스페이스 또는 ↑ 점프 · ↓ 숙이기</p></div>
<button id="gear">⚙ 설정</button>
<button id="rankBtn">🏆 랭킹</button>
<div class="pads"><button id="bDuck">숙이기</button><button id="bJump">점프</button></div>
<div id="menu" hidden><div class="mp">
<h2>설정</h2>
<h3>공룡 스킨</h3><div class="opts" id="oSkin"></div>
<h3>맵</h3><div class="opts" id="oMap"></div>
<h3>키 설정</h3><div class="opts"><button class="o" id="kJump"></button><button class="o" id="kDuck"></button></div>
<h3>닉네임</h3><div class="opts"><input id="nick" maxlength="10" placeholder="랭킹에 표시할 이름 (10자)" autocomplete="off" aria-label="닉네임"></div>
<h3>소리</h3><div class="opts"><button class="o" id="oSnd"></button></div>
<button class="o go" id="mClose">닫고 계속하기</button>
</div></div>
<div id="rankPanel" hidden><div class="mp">
<h2>랭킹</h2>
<ol class="rl" id="rankList"></ol>
<p class="rn" id="rankNote"></p>
<button class="o go" id="rClose">닫기</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xeaf2f5);scene.fog=new THREE.Fog(0xeaf2f5,25,60);
const cam=new THREE.PerspectiveCamera(50,1,.1,100);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(ren.domElement);
function fit(){const w=innerWidth,h=innerHeight;ren.setSize(w,h);cam.aspect=w/h;
  const portrait=w<h;cam.fov=portrait?70:50;cam.position.set(portrait?-.5:-1,portrait?4.6:4,portrait?13:10.5);cam.lookAt(portrait?5:5,1.3,0);cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();
const hemi=new THREE.HemisphereLight(0xffffff,0xbfb49a,.85);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(-4,10,6);scene.add(sun);

const M=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,c,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);return m}

/* 땅 */
const ground=box(200,.4,14,0xe3d8bd,20,-.2,0);scene.add(ground);
const dashes=[];for(let i=0;i<28;i++){const d=box(1.2,.05,.12,0xb9ab88,i*2.4-18,.02,2+Math.random()*3);scene.add(d);dashes.push(d)}
const clouds=[];for(let i=0;i<7;i++){const c=new THREE.Group();c.add(box(3,.7,1.4,0xffffff),box(1.8,.7,1.2,0xffffff,.6,.5,0));c.position.set(i*9-10,6+Math.random()*3,-8-Math.random()*8);scene.add(c);clouds.push(c)}

/* 공룡 */
const DX=-3,GRAY=0x4a4a4a;
const dino=new THREE.Group();dino.position.x=DX;scene.add(dino);
const body=new THREE.Group();dino.add(body);
body.add(box(1.2,1.2,1,GRAY,0,1.4,0),box(1.1,.9,.9,GRAY,.5,2.25,0),box(.6,.5,.8,GRAY,1.1,2.1,0),
  box(.9,.5,.6,GRAY,-.9,1.5,0),box(.6,.35,.5,GRAY,-1.5,1.35,0),box(.25,.2,.1,0xffffff,.65,2.5,.46),
  box(.4,.15,.15,GRAY,.7,1.6,.55),box(.4,.15,.15,GRAY,.7,1.6,-.55));
function leg(z){const g=new THREE.Group();g.position.set(0,.9,z);g.add(box(.38,.9,.38,GRAY,0,-.45,0),box(.55,.18,.4,GRAY,.1,-.9,0));dino.add(g);return g}
const legA=leg(.28),legB=leg(-.28);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(.9,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.15}));
shadow.rotation.x=-Math.PI/2;shadow.position.set(DX,.03,0);scene.add(shadow);

/* 장애물 */
let obs=[];
function cactus(){
  const n=1+Math.floor(Math.random()*3),g=new THREE.Group();let x=0;
  for(let i=0;i<n;i++){const h=1.6+Math.random()*1.3;
    g.add(box(.5,h,.5,0x3f7d4e,x,h/2,0),box(.6,.3,.3,0x3f7d4e,x-.45,h*.55,0),box(.3,.7,.3,0x3f7d4e,x-.6,h*.55+.3,0),box(.6,.3,.3,0x3f7d4e,x+.45,h*.4,0),box(.3,.6,.3,0x3f7d4e,x+.6,h*.4+.25,0));x+=1.4}
  g.traverse(m=>m.material&&m.material.color.setHex(MAPS[cfg.map].cac));
  return {g,w:n*1.4-.4,y:0,h:1.6,x:48,cx:(n-1)*.7}
}
function bird(){
  const g=new THREE.Group(),hi=Math.random()<.55,y=hi?1.9:.6;
  const wl=box(.7,.1,.7,0x6b6b6b,0,.1,.6),wr=box(.7,.1,.7,0x6b6b6b,0,.1,-.6);
  g.add(box(1,.45,.5,0x6b6b6b),box(.5,.2,.2,0xf2a33a,.7,0,0),wl,wr);g.position.y=y;g.userData={wl,wr};
  return {g,w:1.2,y:y-.25,h:.55,x:48,cx:0,bird:true}
}

/* 상태 */
let state='ready',speed=14,score=0,hi=+store.get('dinoHi')||0,y=0,vy=0,duck=false,spawn=1.2,t=0,overAt=0,mile=0,paused=false,binding=null,ac=null;

/* 설정 · 스킨 · 맵 */
const SKINS={gray:{n:'회색',c:0x4a4a4a},green:{n:'초록',c:0x2f9e5b},orange:{n:'주황',c:0xe8793a},purple:{n:'보라',c:0x7b5cd6},white:{n:'하양',c:0xf1f1f1}};
const MAPS={
 desert:{n:'사막',sky:0xeaf2f5,ground:0xe3d8bd,dash:0xb9ab88,cac:0x3f7d4e,cloud:0xffffff,li:1,ink:'#3b3b3b',panel:'rgba(255,255,255,.85)'},
 meadow:{n:'초원',sky:0xd9f0ff,ground:0x9bd17a,dash:0x78b55a,cac:0x2a5d34,cloud:0xffffff,li:1,ink:'#2f3b2f',panel:'rgba(255,255,255,.85)'},
 night:{n:'밤',sky:0x232b52,ground:0x3a4272,dash:0x566099,cac:0x7fe0a0,cloud:0x39426e,li:.55,ink:'#e8ecff',panel:'rgba(35,43,82,.85)'},
 snow:{n:'눈밭',sky:0xe8eef7,ground:0xffffff,dash:0xcfd9e8,cac:0x4d8a9b,cloud:0xf4f7fb,li:1,ink:'#3b4a5a',panel:'rgba(255,255,255,.85)'}
};
let cfg={map:'desert',skin:'gray',sound:true,jump:'Space',duck:'ArrowDown',nick:''};
try{Object.assign(cfg,JSON.parse(store.get('dinoCfg')||'{}'))}catch(e){}
if(!MAPS[cfg.map])cfg.map='desert';if(!SKINS[cfg.skin])cfg.skin='gray';
const save=()=>store.set('dinoCfg',JSON.stringify(cfg));
dino.traverse(m=>{if(m.material&&m.material.color.getHex()===GRAY)m.userData.skin=1});
function applySkin(){dino.traverse(m=>m.userData.skin&&m.material.color.setHex(SKINS[cfg.skin].c))}
function applyMap(){const m=MAPS[cfg.map];
 scene.background.setHex(m.sky);scene.fog.color.setHex(m.sky);ground.material.color.setHex(m.ground);
 dashes.forEach(d=>d.material.color.setHex(m.dash));
 clouds.forEach(c=>c.traverse(x=>x.material&&x.material.color.setHex(m.cloud)));
 hemi.intensity=.85*m.li;sun.intensity=.7*m.li;
 obs.forEach(o=>scene.remove(o.g));obs=[];
 const r=document.documentElement.style;r.setProperty('--ink',m.ink);r.setProperty('--panel',m.panel)}

/* 효과음 */
function snd(type){
 if(!cfg.sound)return;
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const S={jump:[[420,760,.13,'square']],die:[[320,70,.4,'sawtooth']],point:[[880,880,.08,'square'],[1320,1320,.12,'square']],click:[[600,600,.05,'triangle']]}[type];
  let at=ac.currentTime;
  S.forEach(([a,b,d,w])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=w;o.frequency.setValueAtTime(a,at);o.frequency.exponentialRampToValueAtTime(b,at+d);
   g.gain.setValueAtTime(.12,at);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g);g.connect(ac.destination);o.start(at);o.stop(at+d);at+=d});
 }catch(e){}
}

/* 메뉴 */
const keyName=c=>({Space:'스페이스',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'}[c]||c.replace(/^(Key|Digit)/,''));
const col=o=>'#'+(o.c!==undefined?o.c:o.ground).toString(16).padStart(6,'0');
function hint(){if(state==='ready')$('#msg p').textContent=keyName(cfg.jump)+' 점프 · '+keyName(cfg.duck)+' 숙이기'}
function build(){
 const mk=(id,obj,key,fn)=>{const box=$(id);box.innerHTML='';
  for(const k in obj){const b=document.createElement('button');b.className='o';b.setAttribute('aria-pressed',cfg[key]===k);
   b.innerHTML='<i class="sw" style="background:'+col(obj[k])+'"></i>'+obj[k].n;
   b.onclick=()=>{cfg[key]=k;save();fn();snd('click');build()};box.appendChild(b)}};
 mk('#oSkin',SKINS,'skin',applySkin);mk('#oMap',MAPS,'map',applyMap);
 $('#kJump').textContent='점프: '+(binding==='jump'?'키를 누르세요':keyName(cfg.jump));
 $('#kDuck').textContent='숙이기: '+(binding==='duck'?'키를 누르세요':keyName(cfg.duck));
 $('#oSnd').textContent='효과음 '+(cfg.sound?'켜짐':'꺼짐');$('#oSnd').setAttribute('aria-pressed',cfg.sound);
 hint();
}
function setMenu(open){paused=open;$('#menu').hidden=!open;binding=null;if(open){setDuck(false);build();$('#nick').value=cfg.nick||'';$('#mClose').focus()}}
$('#gear').onclick=e=>{setMenu(true);e.currentTarget.blur()};
$('#mClose').onclick=()=>setMenu(false);
$('#menu').onclick=e=>{if(e.target.id==='menu')setMenu(false)};
$('#kJump').onclick=()=>{binding='jump';build()};
$('#kDuck').onclick=()=>{binding='duck';build()};
$('#oSnd').onclick=()=>{cfg.sound=!cfg.sound;save();snd('click');build()};
applySkin();applyMap();hint();

/* 랭킹 */
let rdb=null,ruser=null,myId=null,rows=[],names={},rState='wait',rankErr='';
function renderRank(){
 const ol=$('#rankList'),note=$('#rankNote');ol.innerHTML='';
 if(rState==='off'){note.textContent='이 페이지에서는 랭킹을 쓸 수 없어요. claude.ai에 로그인한 상태로 열어 보세요.';return}
 if(rState==='wait'){note.textContent='랭킹을 불러오는 중…';return}
 note.textContent=rankErr||(rows.length?'':'아직 기록이 없어요. 첫 기록을 남겨 보세요!');
 rows.slice(0,10).forEach((r,i)=>{const li=document.createElement('li');if(r.id===myId)li.className='me';
  const a=document.createElement('span'),b=document.createElement('b');
  a.textContent=(i+1)+'. '+((r.id===myId&&nickVal())||r.name||names[r.id]||'익명')+(r.id===myId?' (나)':'');b.textContent=pad(r.score);li.append(a,b);ol.appendChild(li)});
 if(!rankErr&&!nickVal())note.textContent=(note.textContent+' 설정에서 닉네임을 정하면 이름이 표시돼요.').trim();
 if(!rankErr&&ruser&&ruser.can&&ruser.can('data.write')===false)note.textContent='이 계정은 보기 전용이라 기록은 남길 수 없어요.';
}
async function submitScore(s){
 if(!rdb||!myId)return;
 const v=Math.floor(s);
 try{const ref=rdb.collection('scores').doc(myId);const cur=await ref.get();
  const old=cur.exists?(+cur.data().score||0):0,nm=nickVal();
  if(!cur.exists||old<v||(cur.data().name||'')!==nm)await ref.set({score:Math.max(old,v),name:nm,at:Date.now()})}catch(e){}
}
function nickVal(){return String(cfg.nick||'').trim().slice(0,10)}
async function syncNick(){
 if(!rdb||!myId)return;
 try{const ref=rdb.collection('scores').doc(myId);const cur=await ref.get();
  if(cur.exists&&(cur.data().name||'')!==nickVal())await ref.set({...cur.data(),name:nickVal()})}catch(e){}
}
(async()=>{
 try{
  if(typeof claude==='undefined')throw 0;
  const r=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!r[0])throw 0;
  rdb=r[0];ruser=r[1];myId=ruser?await ruser.id():null;
  rdb.collection('scores').orderBy('score','desc').limit(20).onSnapshot(async s=>{
   rows=s.docs.map(x=>({id:x.id,score:+x.data().score||0,name:String(x.data().name||'').slice(0,10)}));
   if(ruser){try{const ps=await ruser.profiles(rows.map(x=>x.id));rows.forEach(x=>{names[x.id]=(ps[x.id]&&ps[x.id].name)||''})}catch(e){}}
   rState='ok';rankErr='';renderRank();
  },()=>{rankErr='랭킹을 불러오지 못했어요.';rState='ok';renderRank()});
 }catch(e){rState='off'}
 renderRank();
})();
setTimeout(()=>{if(rState==='wait'){rState='off';renderRank()}},10000);
function setRank(o){paused=o;$('#rankPanel').hidden=!o;if(o){setDuck(false);renderRank();$('#rClose').focus()}}
$('#rankBtn').onclick=e=>{setRank(true);e.currentTarget.blur()};
$('#rClose').onclick=()=>setRank(false);
$('#rankPanel').onclick=e=>{if(e.target.id==='rankPanel')setRank(false)};
$('#nick').oninput=e=>{cfg.nick=e.target.value.slice(0,10);save()};
$('#nick').onchange=()=>{syncNick();renderRank()};
const pad=n=>String(Math.floor(n)).padStart(5,'0');
$('#hi').textContent=pad(hi);
function start(){obs.forEach(o=>scene.remove(o.g));obs=[];speed=14;score=0;mile=0;y=0;vy=0;spawn=1.2;state='run';$('#msg').style.display='none'}
function jump(){
  if(state==='ready')return start();
  if(state==='over'){if(performance.now()-overAt>400)start();return}
  if(y<=0.001&&!duck){vy=16;snd('jump')}
}
function setDuck(v){duck=v;if(v&&y>0)vy=Math.min(vy,-14)}
addEventListener('keydown',e=>{
  if(binding){e.preventDefault();
    if(e.code!=='Escape'){const o=binding==='jump'?'duck':'jump';if(e.code===cfg[o])cfg[o]=cfg[binding];cfg[binding]=e.code;save()}
    binding=null;build();return}
  if(e.code==='Escape'){if(!$('#rankPanel').hidden)setRank(false);else setMenu(!paused);return}
  if(paused)return;
  if(e.code===cfg.jump||(cfg.jump==='Space'&&e.code==='ArrowUp'&&cfg.duck!=='ArrowUp')){e.preventDefault();if(!e.repeat)jump()}
  if(e.code===cfg.duck){e.preventDefault();setDuck(true)}
});
addEventListener('keyup',e=>{if(e.code===cfg.duck)setDuck(false)});
ren.domElement.addEventListener('pointerdown',jump);
$('#bJump').addEventListener('pointerdown',e=>{e.stopPropagation();jump()});
$('#bDuck').addEventListener('pointerdown',e=>{e.stopPropagation();setDuck(true)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>$('#bDuck').addEventListener(ev,()=>setDuck(false)));

function die(){
  state='over';overAt=performance.now();snd('die');submitScore(score);
  if(score>hi){hi=score;store.set('dinoHi',Math.floor(hi));$('#hi').textContent=pad(hi)}
  $('#msg').innerHTML='<h1>꽈당!</h1><p>'+pad(score)+'점 · '+keyName(cfg.jump)+' 키로 다시 도전</p>';$('#msg').style.display='grid';
}

/* 루프 */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;
  const run=state==='run'&&!paused;
  if(run){
    speed=Math.min(14+score*.012,30);score+=dt*speed*.8;
    if(Math.floor(score/100)>mile){mile=Math.floor(score/100);snd('point')}
    vy-=45*dt;y+=vy*dt;if(y<=0){y=0;vy=0}
    spawn-=dt;
    if(spawn<=0){const o=(score>250&&Math.random()<.3)?bird():cactus();o.g.position.x=o.x;scene.add(o.g);obs.push(o);spawn=(.95+Math.random()*1.1)*(14/speed)+.35}
    for(const o of obs){
      o.x-=speed*dt;o.g.position.x=o.x;
      if(o.bird){const f=Math.sin(t*20)*.7;o.g.userData.wl.rotation.x=f;o.g.userData.wr.rotation.x=-f}
      const ox=o.x+o.cx,dh=duck&&y<.01?1.5:2.7;
      if(Math.abs(ox-(DX+.25))<(o.w/2+.55)-.15&&y<o.y+o.h-.15&&y+dh>o.y+.15)die();
    }
    obs=obs.filter(o=>{if(o.x<-14){scene.remove(o.g);return false}return true});
    $('#sc').textContent=pad(score);
  }
  const m=paused?0:run?speed:3;
  dashes.forEach(d=>{d.position.x-=m*dt;if(d.position.x<-18)d.position.x+=67});
  clouds.forEach(c=>{c.position.x-=m*dt*.15;if(c.position.x<-22)c.position.x=48});
  dino.position.y=y;shadow.scale.setScalar(Math.max(.4,1-y*.15));
  const flat=duck&&y<.01;body.scale.y=flat?.6:1;body.position.y=flat?-.1:0;
  body.rotation.z=state==='over'?-.5:(y>0?.1:0);
  const sw=state==='run'&&y<=0?Math.sin(t*(speed*.9))*.9:0;legA.rotation.z=sw;legB.rotation.z=-sw;
  ren.render(scene,cam);
}
requestAnimationFrame(loop);
</script>
